name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read protocol source pin
        id: protocol
        run: python3 -c 'import json, os; pin=json.load(open("scripts/protocol-source.json")); open(os.environ["GITHUB_OUTPUT"], "a").write("revision=" + pin["revision"] + "\n")'

      - name: Check out public protocol source
        uses: actions/checkout@v6
        with:
          repository: rachel-multiverse/protocol
          ref: ${{ steps.protocol.outputs.revision }}
          path: .protocol-source

      - name: Verify generated protocol page
        run: bash scripts/protocol.sh .protocol-source --check

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
